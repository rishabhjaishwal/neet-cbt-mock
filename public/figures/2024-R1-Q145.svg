    <circle cx="82" cy="274" r="4.5" fill="#1e293b"/>
    <circle cx="198" cy="274" r="4.5" fill="#1e293b"/>

    <path d="M140 210 c-28 12 -44 30 -46 56"/>
    <path d="M140 210 c28 12 44 30 46 56"/>
    <path d="M94 260 c-12 24 -10 44 -2 62"/>
